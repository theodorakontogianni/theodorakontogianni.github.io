name: Deploy website to GitHub Pages

on:
  push:
    branches: [group]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler: '2.4.22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick graphviz jupyter-nbconvert

      - name: Install Ruby dependencies
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4 --retry 3

      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the website
        id: jekyll
        run: |
          set -o pipefail
          bundle exec jekyll build --trace --destination ./_site 2>&1 | tee "$RUNNER_TEMP/jekyll-build.log"
        env:
          JEKYLL_ENV: production

      - name: Report build error
        if: ${{ failure() && steps.jekyll.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP'], 'jekyll-build.log').read_text()
          excerpt = '\n'.join(log.splitlines()[-100:])
          excerpt = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Jekyll build failed::{excerpt}')
          PY

      - name: Upload the built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
